name: vercel preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: deploy vercel preview
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel secret availability
        id: vercel-secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skip reason
        if: ${{ steps.vercel-secrets.outputs.available != 'true' }}
        run: |
          echo "Vercel preview skipped: set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repository secrets."

      - name: Checkout
        if: ${{ steps.vercel-secrets.outputs.available == 'true' }}
        uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ steps.vercel-secrets.outputs.available == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: ${{ steps.vercel-secrets.outputs.available == 'true' }}
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: ${{ steps.vercel-secrets.outputs.available == 'true' }}
        working-directory: apps/web
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build preview artifacts
        if: ${{ steps.vercel-secrets.outputs.available == 'true' }}
        working-directory: apps/web
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel preview
        if: ${{ steps.vercel-secrets.outputs.available == 'true' }}
        id: deploy
        working-directory: apps/web
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL
        if: ${{ steps.vercel-secrets.outputs.available == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const body = [
              "## Vercel Preview",
              "",
              `Preview URL: ${process.env.PREVIEW_URL}`,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
